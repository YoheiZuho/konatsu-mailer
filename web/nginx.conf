# Konatsu Mailer — frontend nginx config.
# Serves the built SPA and reverse-proxies the API (incl. WebSocket) to the
# backend service so the browser talks to a single origin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend service name within the compose network (overridable via env at
    # build time is not used; the upstream is fixed to the compose service).
    set $backend "http://backend:8080";

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # API + WebSocket → backend.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (GET /api/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE (POST /api/ai/draft): disable buffering for streaming.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # The service worker must never be cached, or clients get stuck on old builds.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Fingerprinted build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
